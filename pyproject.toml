[project]
name = "pr-diff-review"
version = "0.1.0"
description = "Generate categorized HTML diff viewers for GitHub PRs with intelligent grouping"
authors = [
    {name = "Avi Zohary", email = "avi@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["github", "pull-request", "diff", "review", "code-review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.27.0",
    "anthropic>=0.39.0",
    "openai>=1.0.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "types-httpx",
]

[project.scripts]
pr-diff-review = "pr_diff_review.cli.main:main"

[project.urls]
Homepage = "https://github.com/cisco-foundation-ai/diff-review"
Repository = "https://github.com/cisco-foundation-ai/diff-review"
Issues = "https://github.com/cisco-foundation-ai/diff-review/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pr_diff_review"]

[tool.hatch.build.targets.wheel.shared-data]
".claude-skill" = "share/pr-diff-review/.claude-skill"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=pr_diff_review --cov-report=term-missing"
