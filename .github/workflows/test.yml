name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv venv
        source .venv/bin/activate
        uv pip install -e ".[dev]"

    - name: Run tests
      run: |
        source .venv/bin/activate
        pytest tests/ -v

    - name: Check imports
      run: |
        source .venv/bin/activate
        python -c "from pr_diff_review import PRDiffFetcher, LLMCategorizer, HTMLGenerator"
        echo "✓ All imports successful"

    - name: Verify CLI
      run: |
        source .venv/bin/activate
        pr-diff-review --help

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv venv
        source .venv/bin/activate
        uv pip install -e ".[dev]"

    - name: Run ruff check
      run: |
        source .venv/bin/activate
        ruff check pr_diff_review

    - name: Run ruff format check
      run: |
        source .venv/bin/activate
        ruff format --check pr_diff_review

    - name: Run mypy
      run: |
        source .venv/bin/activate
        mypy pr_diff_review --exclude 'pr_diff_review/cli/main.py' || true
